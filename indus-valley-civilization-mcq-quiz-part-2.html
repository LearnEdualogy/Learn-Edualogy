<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: "Noto Sans Kannada", "Noto Sans", sans-serif;
    background: #EAF2FA;
    color: #1A1A1A;
  }

  .container {
    max-width: 650px;
    margin: auto;
  }

  .card {
    background: #ffffff;

    padding: 25px;

  }

  .cover-icon {
    text-align: center;
    font-size: 55px;
    margin-bottom: 10px;
  }

  h1 {
    color: #1F3A5F;
    text-align: center;
    margin: 0;
    font-size: 28px;
  }

  .subtitle {
    text-align: center;
    color: #444444;
    font-size: 17px;
    margin: 10px 0 20px;
  }

  .info-box {
    background: #FFF6DC;
    border: 3px solid #FFC93C;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 20px;
  }

  .info-box p {
    margin: 6px 0;
    font-size: 16px;
  }

  .info-box strong {
    color: #1F3A5F;
  }

  .start-button {
    display: block;
    width: 100%;
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    background: #1F3A5F;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .start-button:hover {
    background: #2E8B57;
    transform: translateY(-3px);
  }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-weight: bold;
    color: #1F3A5F;
  }

  .timer {
    background: #FFC93C;
    color: #1F3A5F;
    padding: 6px 14px;
    border-radius: 20px;
  }

  .progress-bar {
    height: 12px;
    background: #D9E4F1;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #2E8B57;
    transition: width 0.3s ease;
  }

  .question {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 20px;
  }

  .option {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 18px;
    text-align: left;
    color: #1A1A1A;
    background: #F5F9FF;
    border: 2px solid #1F3A5F;
    border-radius: 12px;
    cursor: pointer;
  }

  .option:hover:not(:disabled) {
    background: #FFC93C;
  }

  .option:disabled {
    cursor: not-allowed;
  }

  .correct {
    background: #EAF7EF !important;
    border-color: #2E8B57 !important;
  }

  .wrong {
    background: #FDECEA !important;
    border-color: #C0392B !important;
  }

  .feedback {
    min-height: 30px;
    margin: 15px 0;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
  }

  .feedback.correct {
    color: #2E8B57;
  }

  .feedback.wrong {
    color: #C0392B;
  }

  .next-button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    background: #1F3A5F;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 10px;
  }

  .result-score {
    font-size: 30px;
    font-weight: bold;
    color: #1F3A5F;
    text-align: center;
  }

  .result-message {
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
  }

  .review-list {
    padding: 0;
    list-style: none;
  }

  .review-list li {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: #EAF2FA;
  }

  .review-correct {
    border-left: 6px solid #2E8B57;
  }

  .review-wrong {
    border-left: 6px solid #C0392B;
  }

  .home-button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #1F3A5F;
    background: #E5E7EB;
    border: none;
    border-radius: 12px;

    margin-top: 15px;

  }

    .card {

    }

    h1 {
      font-size: 23px;
    }

    .question {
      font-size: 18px;
    }

    .option {

    }
  }
</style>
</head>

</div>

const TIME_PER_QUESTION = 30;

let currentQuestion = 0;
let score = 0;
let timeLeft = TIME_PER_QUESTION;
let timer = null;
let userAnswers = [];

const coverScreen = document.getElementById("coverScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const questionText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const feedback = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");
const progressFill = document.getElementById("progressFill");
const timerBox = document.getElementById("timer");
const reviewList = document.getElementById("reviewList");

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  userAnswers = [];

  coverScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  const question = questions[currentQuestion];

  questionText.textContent =
    "ಪ್ರಶ್ನೆ " + (currentQuestion + 1) + ": " + question.question;

  optionsBox.innerHTML = "";
  feedback.textContent = "";
  feedback.className = "feedback";
  nextButton.classList.add("hidden");

  updateProgress();
  startTimer();

  question.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;

    button.onclick = function () {
      selectAnswer(index, button);
    };

    optionsBox.appendChild(button);
  });
}

function selectAnswer(selectedIndex, selectedButton) {
  stopTimer();

  const question = questions[currentQuestion];
  const allButtons = optionsBox.querySelectorAll(".option");

  allButtons.forEach(button => {
    button.disabled = true;
  });

  const isCorrect = selectedIndex === question.answer;

  if (isCorrect) {
    score++;
    selectedButton.classList.add("correct");
    feedback.textContent = "ಸರಿಯಾಗಿದೆ! 🎉";
    feedback.className = "feedback correct";
  } else {
    selectedButton.classList.add("wrong");
    allButtons[question.answer].classList.add("correct");
    feedback.textContent = "ತಪ್ಪಾಗಿದೆ. " + question.explanation;
    feedback.className = "feedback wrong";
  }

  userAnswers.push({
    question: question.question,
    selected: question.options[selectedIndex],
    correctAnswer: question.options[question.answer],
    isCorrect: isCorrect,
    explanation: question.explanation
  });

  nextButton.classList.remove("hidden");
}

function updateProgress() {
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  progressFill.style.width = progress + "%";
}

function startTimer() {
  stopTimer();

  timeLeft = TIME_PER_QUESTION;
  timerBox.textContent = timeLeft;

  timer = setInterval(function () {
    timeLeft--;
    timerBox.textContent = timeLeft;

    if (timeLeft <= 0) {
      stopTimer();
      selectAnswer(-1, optionsBox.querySelector(".option"));
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timer);
}

function nextQuestion() {
  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  stopTimer();

  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");

  document.getElementById("finalScore").textContent =
    "ನಿಮ್ಮ ಅಂಕ: " + score + " / " + questions.length;

  let message = "";

  if (score === questions.length) {
    message = "ಅದ್ಭುತ! ನೀವು ಎಲ್ಲವನ್ನೂ ಸರಿಯಾಗಿ ಉತ್ತರಿಸಿದ್ದೀರಿ! 🎉";
  } else if (score >= 15) {
    message = "ಚೆನ್ನಾಗಿದೆ! ಇನ್ನಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ.";
  } else {
    message = "ಚಿಂತೆ ಬೇಡ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ!";
  }

  document.getElementById("resultMessage").textContent = message;

  reviewList.innerHTML = "";

  userAnswers.forEach(function (item) {
    const listItem = document.createElement("li");
    listItem.className = item.isCorrect ? "review-correct" : "review-wrong";

    listItem.innerHTML =
      "<strong>" + item.question + "</strong><br>" +
      "ನಿಮ್ಮ ಉತ್ತರ: " + item.selected + "<br>" +
      "ಸರಿಯಾದ ಉತ್ತರ: " + item.correctAnswer + "<br>" +
      "<em>" + item.explanation + "</em>";

    reviewList.appendChild(listItem);
  });
}

function goHome() {
  stopTimer();

  quizScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  coverScreen.classList.remove("hidden");
}

nextButton.onclick = nextQuestion;
