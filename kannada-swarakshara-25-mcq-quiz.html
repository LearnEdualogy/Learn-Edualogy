<style>

  }

  .option:disabled {
    cursor: not-allowed;
  }

  .correct {
    background: #EAF7EF !important;
    border-color: #2E8B57 !important;
  }

  .wrong {
    background: #FDECEA !important;
    border-color: #C0392B !important;
  }

  .feedback {
    min-height: 30px;
    margin: 15px 0;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
  }

  .feedback.correct {
    color: #2E8B57;
  }

  .feedback.wrong {

  }

  .next-button {

    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    background: #1F3A5F;
    border: none;

  .result-message {

  .review-list {

  }

  .review-list li {

    background: #EAF2FA;

const TIME_PER_QUESTION = 30;

let currentQuestion = 0;
let score = 0;
let timeLeft = TIME_PER_QUESTION;
let timer = null;
let userAnswers = [];

const coverScreen = document.getElementById("coverScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const questionText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const feedback = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");
const progressFill = document.getElementById("progressFill");
const timerBox = document.getElementById("timer");
const reviewList = document.getElementById("reviewList");

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  userAnswers = [];

  coverScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  const question = questions[currentQuestion];

  questionText.textContent =
    "ಪ್ರಶ್ನೆ " + (currentQuestion + 1) + ": " + question.question;

  optionsBox.innerHTML = "";
  feedback.textContent = "";
  feedback.className = "feedback";
  nextButton.classList.add("hidden");

  updateProgress();
  startTimer();

  question.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;

    button.onclick = function () {
      selectAnswer(index, button);
    };

    optionsBox.appendChild(button);
  });
}

function selectAnswer(selectedIndex, selectedButton) {
  stopTimer();

  const question = questions[currentQuestion];
  const allButtons = optionsBox.querySelectorAll(".option");

  allButtons.forEach(button => {
    button.disabled = true;
  });

  const isCorrect = selectedIndex === question.answer;

  if (isCorrect) {
    score++;
    selectedButton.classList.add("correct");
    feedback.textContent = "ಸರಿಯಾಗಿದೆ! 🎉";
    feedback.className = "feedback correct";
  } else {
    selectedButton.classList.add("wrong");
    allButtons[question.answer].classList.add("correct");
    feedback.textContent = "ತಪ್ಪಾಗಿದೆ. " + question.explanation;
    feedback.className = "feedback wrong";
  }

  userAnswers.push({
    question: question.question,
    selected: question.options[selectedIndex],
    correctAnswer: question.options[question.answer],
    isCorrect: isCorrect,
    explanation: question.explanation
  });

  nextButton.classList.remove("hidden");
}

function updateProgress() {
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  progressFill.style.width = progress + "%";
}

function startTimer() {
  stopTimer();

  timeLeft = TIME_PER_QUESTION;
  timerBox.textContent = timeLeft;

  timer = setInterval(function () {
    timeLeft--;
    timerBox.textContent = timeLeft;

    if (timeLeft <= 0) {
      stopTimer();
      selectAnswer(-1, optionsBox.querySelector(".option"));
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timer);
}

function nextQuestion() {
  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  stopTimer();

  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");

  document.getElementById("finalScore").textContent =
    "ನಿಮ್ಮ ಅಂಕ: " + score + " / " + questions.length;

  let message = "";

  if (score === questions.length) {
    message = "ಅದ್ಭುತ! ನೀವು ಎಲ್ಲವನ್ನೂ ಸರಿಯಾಗಿ ಉತ್ತರಿಸಿದ್ದೀರಿ! 🎉";
  } else if (score >= 15) {
    message = "ಚೆನ್ನಾಗಿದೆ! ಇನ್ನಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ.";
  } else {
    message = "ಚಿಂತೆ ಬೇಡ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ!";
  }

  document.getElementById("resultMessage").textContent = message;

  reviewList.innerHTML = "";

  userAnswers.forEach(function (item) {
    const listItem = document.createElement("li");
    listItem.className = item.isCorrect ? "review-correct" : "review-wrong";

    listItem.innerHTML =
      "<strong>" + item.question + "</strong><br>" +
      "ನಿಮ್ಮ ಉತ್ತರ: " + item.selected + "<br>" +
      "ಸರಿಯಾದ ಉತ್ತರ: " + item.correctAnswer + "<br>" +
      "<em>" + item.explanation + "</em>";

    reviewList.appendChild(listItem);
  });
}

function goHome() {
  stopTimer();

  quizScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  coverScreen.classList.remove("hidden");
}

nextButton.onclick = nextQuestion;
</script>
